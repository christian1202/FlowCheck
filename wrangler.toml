name = "flowcheck"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

# Required for Postgres access from Cloudflare Workers. Create one with:
#   npx wrangler hyperdrive create flowcheck-db --connection-string="<DATABASE_URL>"
# Then replace the placeholder with the returned config ID.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<HYPERDRIVE_CONFIG_ID>"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# [[queues.producers]]
# queue = "sheets-sync"
# binding = "SHEETS_QUEUE"

# [[queues.consumers]]
# queue = "sheets-sync"
# max_batch_size = 50
# max_batch_timeout = 30

# All environment variables are managed as secrets (not in [vars]):
#   wrangler secret put NEXT_PUBLIC_SUPABASE_URL
#   wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY
#   wrangler secret put NEXT_PUBLIC_APP_URL
#   wrangler secret put DATABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put CRON_SECRET
#   wrangler secret put BREVO_API_KEY

[triggers]
crons = ["59 23 * * *"]
